#
# src.conf -- WITHOUT knobs for a minimal FreeBSD container base image.
#
# Keeps: OpenSSL, fetch(1), libarchive, the CA root store, vi(1), basic
# shell utilities, and everything pkg needs to bootstrap and run.
#
# Knobs checked against tools/build/options on stable/15.
#
# Usage:
#   make -j$(sysctl -n hw.ncpu) buildworld SRCCONF=/path/to/src.conf
#   make installworld SRCCONF=/path/to/src.conf DESTDIR=... \
#       WITHOUT_INCLUDES=yes WITHOUT_INSTALLLIB=yes
#   make distribution SRCCONF=/path/to/src.conf DESTDIR=...
#

# Compiler toolchain -- not needed inside a container image. TOOLCHAIN
# also turns off CLANG, LLD, LLDB and LLVM_BINUTILS. It only changes what
# is installed: buildworld still builds what it needs to compile.
WITHOUT_TOOLCHAIN=yes
WITHOUT_OPENMP=yes
WITHOUT_GOOGLETEST=yes

# Headers and static libraries are left out at installworld time; see the
# Cblockfile. WITHOUT_INCLUDES and WITHOUT_INSTALLLIB must not be set here:
# buildworld installs its own bootstrap headers and libraries (liblegacy.a)
# and fails without them.

# Documentation
WITHOUT_MAN=yes
WITHOUT_HTML=yes
WITHOUT_DICT=yes
WITHOUT_EXAMPLES=yes
WITHOUT_SHAREDOCS=yes
WITHOUT_MAN_UTILS=yes

# Locales -- pkg does not need them; add WITH_LOCALES if ports require them
WITHOUT_LOCALES=yes
WITHOUT_ICONV=yes
WITHOUT_NLS=yes

# Mail -- MAIL also turns off SENDMAIL, DMAGENT and MAILWRAPPER
WITHOUT_MAIL=yes

# Authentication / directory services
WITHOUT_NIS=yes
WITHOUT_KERBEROS=yes

# Network services and tools not needed in a container
WITHOUT_OPENSSH=yes
WITHOUT_BLUETOOTH=yes
WITHOUT_WIRELESS=yes
WITHOUT_WIRELESS_SUPPORT=yes
WITHOUT_OFED=yes
WITHOUT_PPP=yes
WITHOUT_RADIUS_SUPPORT=yes
WITHOUT_BOOTPARAMD=yes
WITHOUT_BOOTPD=yes
WITHOUT_BSNMP=yes
WITHOUT_FINGER=yes
WITHOUT_INETD=yes
WITHOUT_NETGRAPH=yes
WITHOUT_NTP=yes
WITHOUT_RBOOTD=yes
WITHOUT_ROUTED=yes
WITHOUT_TALK=yes
WITHOUT_TELNET=yes
WITHOUT_TFTP=yes
WITHOUT_UNBOUND=yes
WITHOUT_NETCAT=yes

# Firewalling -- handled by host
WITHOUT_IPFW=yes
WITHOUT_PF=yes
WITHOUT_IPFILTER=yes
WITHOUT_AUTHPF=yes

# Storage / clustering -- not needed in container. CDDL also turns off
# ZFS and DTrace.
WITHOUT_HAST=yes
WITHOUT_ISCSI=yes
WITHOUT_CDDL=yes
WITHOUT_AUTOFS=yes
WITHOUT_CCD=yes
WITHOUT_QUOTAS=yes

# Hardware, boot and console -- the host owns these
WITHOUT_BOOT=yes
WITHOUT_EFI=yes
WITHOUT_ACPI=yes
WITHOUT_APM=yes
WITHOUT_BHYVE=yes
WITHOUT_HYPERV=yes
WITHOUT_CUSE=yes
WITHOUT_CXGBETOOL=yes
WITHOUT_MLX5TOOL=yes
WITHOUT_FLOPPY=yes
WITHOUT_GPIO=yes
WITHOUT_USB=yes
WITHOUT_SOUND=yes
WITHOUT_PMC=yes
WITHOUT_LEGACY_CONSOLE=yes
WITHOUT_SYSCONS=yes
WITHOUT_VT=yes
# Wireless firmware in /boot/firmware -- WIRELESS does not cover it
WITHOUT_SOURCELESS_UCODE=yes

# Installer and updates -- images are rebuilt, not updated in place
WITHOUT_BSDINSTALL=yes
WITHOUT_FREEBSD_UPDATE=yes
WITHOUT_NUAGEINIT=yes

# 32-bit compatibility -- not needed in a container image
WITHOUT_LIB32=yes

# Shells and editors -- /bin/sh and vi(1) stay
WITHOUT_TCSH=yes
WITHOUT_NLS_CATALOGS=yes
WITHOUT_EE=yes

# Misc
WITHOUT_ACCT=yes
WITHOUT_BLOCKLIST=yes
WITHOUT_CALENDAR=yes
WITHOUT_GAMES=yes
WITHOUT_LOCATE=yes
WITHOUT_LPR=yes
WITHOUT_TESTS=yes
WITHOUT_RESCUE=yes
WITHOUT_DEBUG_FILES=yes
# /var/db/services.db -- nsswitch.conf uses "services: files", so libc
# reads /etc/services directly. /etc/services is still installed.
WITHOUT_SERVICESDB=yes

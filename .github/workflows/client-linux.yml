#
# Build and install the cblock client, and build cblock_warden, on
# Linux.
#
name: client-linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison

      - name: Build and install the client
        run: |
          make client-only
          sudo make client-only-install

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/cblock_warden/go.mod
          cache-dependency-path: src/cblock_warden/go.sum

      - name: Build cblock_warden
        run: make -C src/cblock_warden

      - name: Run the client
        run: |
          cblock --help 2>&1 | grep '^Usage: cblock'

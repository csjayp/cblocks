#
# Build the cblock client .deb for amd64 and arm64 when a v* tag is
# pushed, and publish them as a GitHub release for that tag. See
# LINUX-RELEASE.md.
#
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    strategy:
      matrix:
        # Ubuntu 22.04 is the oldest supported glibc. A package built
        # against it also installs on newer releases.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/mkdeb.sh takes the version from git describe --tags.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison

      - name: Build the package
        run: make deb

      - name: Check the package version matches the tag
        run: |
          version=$(dpkg-deb -f cblock_*.deb Version)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
              echo "package version $version does not match tag $GITHUB_REF_NAME" >&2
              exit 1
          fi
          dpkg-deb -I cblock_*.deb
          dpkg-deb -c cblock_*.deb

      - name: Install and run the package
        run: |
          sudo dpkg -i cblock_*.deb
          cblock --help 2>&1 | grep '^Usage: cblock'

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.runner }}
          path: cblock_*.deb
          if-no-files-found: error

  # Publish only once every architecture has built, so a failed build
  # never leaves a release with some of its packages missing.
  publish:
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cblock_*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "cblock $GITHUB_REF_NAME" \
            --generate-notes

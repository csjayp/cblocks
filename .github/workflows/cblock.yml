#
# Install the cblock client from the latest release, then use it to
# build this repository's Cblockfile on prod.cblock.sqrt.ca over ssh.
#
# Repository settings:
#   secrets.CBLOCK_SSH_KEY          private key for the ssh user
#   secrets.CBLOCK_SSH_KNOWN_HOSTS  prod.cblock.sqrt.ca's known_hosts line(s)
#   vars.CBLOCK_SSH_USER            ssh user on prod (default: ci); it
#                                   must be in the cblock group
#
name: freebsd

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# prod is a single build host, so run one build at a time.
concurrency:
  group: cblock-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CBLOCK_HOST: ssh://prod.cblock.sqrt.ca
    steps:
      - uses: actions/checkout@v4

      - name: Install the released client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest release speaks the same protocol as cblockd on
          # prod. To keep using an older release until prod is upgraded,
          # set the repository variable CBLOCK_CLIENT_VERSION to its tag.
          # See LINUX-RELEASE.md.
          gh release download ${{ vars.CBLOCK_CLIENT_VERSION }} \
            --repo "$GITHUB_REPOSITORY" -p 'cblock_*_amd64.deb' \
            -D "$RUNNER_TEMP"
          sudo dpkg -i "$RUNNER_TEMP"/cblock_*_amd64.deb
          command -v cblock

      - name: Set up ssh
        env:
          SSH_KEY: ${{ secrets.CBLOCK_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CBLOCK_SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ vars.CBLOCK_SSH_USER || 'ci' }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/cblock
          chmod 0600 ~/.ssh/cblock
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Every cblock command opens a new ssh session. Share one
          # connection between them so the job does not trip the rate
          # limit on the ssh port.
          cat > ~/.ssh/config <<EOF
          Host prod.cblock.sqrt.ca
              User $SSH_USER
              IdentityFile ~/.ssh/cblock
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              ControlMaster auto
              ControlPath ~/.ssh/cm-%C
              ControlPersist 10m
          EOF

      - name: Check the connection to cblockd
        run: |
          set -o pipefail
          cblock instances | awk 'NR == 1 || /forge/'

      - name: Build the Cblockfile
        run: cblock build -n cblocks-ci -t "${GITHUB_SHA::12}" .

      - name: Remove the image
        run: cblock images --remove "cblocks-ci:${GITHUB_SHA::12}"

      - name: Close the ssh connection
        if: always()
        run: ssh -O exit prod.cblock.sqrt.ca || true
